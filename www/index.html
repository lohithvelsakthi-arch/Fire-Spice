<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FIRE SPICE | Haute Gastronomie & Golden Lounge • React Table Booking</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#060608">
  <meta name="description" content="FIRE SPICE • Haute Gastronomie & Golden Lounge Table Reservation and VIP Guest Sanctuary">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FIRE SPICE">
  <meta name="application-name" content="FIRE SPICE">
  <meta name="msapplication-TileColor" content="#060608">

  <!-- Icons & Web App Manifest -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Luxury Black & Gold Glassmorphic Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- Google Fonts: Non-blocking load so app renders instantaneously offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"></noscript>

  <!-- React 18 & ReactDOM: Production Bundles -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>

  <!-- EmailJS SDK: Send owner login-alert emails from the client -->
  <script src="vendor/emailjs.min.js"></script>
</head>
<body>
  <!-- React App Root Container with Instant Luxury Preloader -->
  <div id="root">
    <div id="app-preloader" class="preloader-overlay">
      <div class="preloader-crest">
        <span>FS</span>
      </div>
      <h1 class="preloader-title">FIRE SPICE</h1>
      <p class="preloader-subtitle">HAUTE GASTRONOMIE &amp; GOLDEN LOUNGE</p>
      <div class="preloader-bar">
        <div class="preloader-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Fail-Safe Diagnostics Script -->
  <script>
    window.addEventListener('error', function(e) {
      var preloader = document.getElementById('app-preloader');
      if (preloader) {
        preloader.innerHTML = `
          <div class="preloader-crest" style="border-color: #f87171;">
            <span style="color: #f87171;">!</span>
          </div>
          <h2 class="preloader-title" style="font-size: 1.5rem; color: #f87171; -webkit-text-fill-color: initial;">EXPERIENCE NOTICE</h2>
          <p style="color: #a6a39b; max-width: 440px; font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px;">
            ${e.message || 'An unexpected initialization error occurred.'}
          </p>
          <button onclick="window.location.reload()" class="btn-glass btn-glass-primary" style="padding: 10px 24px; cursor: pointer;">
            Reload FIRE SPICE
          </button>
        `;
      }
    });
  </script>

  <!-- Service Worker Registration for PWA Offline Caching & Installation -->
  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('[PWA] Service Worker registered successfully, scope:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
      });
    }
  </script>

  <!-- React 18 Application Bundle -->
  <script src="bundle.js"></script>

  <!-- -- FIRE SPICE Email Debug Panel -- -->
  <script>
  (function() {
    var btn = document.createElement('div');
    btn.id = 'fs-dbg-btn';
    btn.innerHTML = '??';
    btn.style.cssText = ['position:fixed','bottom:80px','right:16px','z-index:99999','width:48px','height:48px','border-radius:50%','background:linear-gradient(135deg,#d4af37,#b8961e)','display:flex','align-items:center','justify-content:center','font-size:22px','cursor:pointer','box-shadow:0 4px 20px rgba(212,175,55,0.5)','user-select:none','-webkit-tap-highlight-color:transparent'].join(';');
    var panel = document.createElement('div');
    panel.id = 'fs-dbg-panel';
    panel.style.cssText = ['position:fixed','bottom:140px','right:16px','z-index:99998','width:min(360px,calc(100vw - 32px))','max-height:55vh','overflow-y:auto','background:#0d0d12','border:1px solid #d4af37','border-radius:12px','padding:12px','font-family:monospace','font-size:11px','line-height:1.6','display:none','box-shadow:0 8px 32px rgba(0,0,0,0.8)'].join(';');
    panel.innerHTML = '<div style="color:#d4af37;font-weight:700;margin-bottom:8px;font-size:12px;">?? Email Debug Log</div><div id="fs-dbg-log" style="color:#8b7a5a;">Waiting for email events�</div>';
    document.body.appendChild(btn);
    document.body.appendChild(panel);
    var open = false;
    btn.addEventListener('click', function() { open = !open; panel.style.display = open ? 'block' : 'none'; });
    var logEl = null;
    function getLog() { return logEl || (logEl = document.getElementById('fs-dbg-log')); }
    function appendLog(msg, color) {
      var el = getLog(); if (!el) return;
      if (el.textContent.indexOf('Waiting') === 0) el.innerHTML = '';
      var line = document.createElement('div');
      line.style.color = color || '#a0916b';
      line.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
      line.style.padding = '2px 0';
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      el.appendChild(line); el.scrollTop = el.scrollHeight;
      if (msg.indexOf('FIRE SPICE') !== -1) { panel.style.display = 'block'; open = true; }
    }
    var _l=console.log.bind(console),_i=console.info.bind(console),_w=console.warn.bind(console),_e=console.error.bind(console);
    function cap(a,c){var m=Array.from(a).map(function(x){return typeof x==='object'?JSON.stringify(x):String(x);}).join(' ');if(m.indexOf('FIRE SPICE')!==-1||m.indexOf('emailjs')!==-1){appendLog(m,c);}}
    console.log=function(){_l.apply(console,arguments);cap(arguments,'#a0916b');};
    console.info=function(){_i.apply(console,arguments);cap(arguments,'#d4af37');};
    console.warn=function(){_w.apply(console,arguments);cap(arguments,'#fb923c');};
    console.error=function(){_e.apply(console,arguments);cap(arguments,'#f87171');};
  })();
  </script>

</body>
</html>
