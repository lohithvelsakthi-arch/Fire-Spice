<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FIRE SPICE | Haute Gastronomie & Golden Lounge • React Table Booking</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#060608">
  <meta name="description" content="FIRE SPICE • Haute Gastronomie & Golden Lounge Table Reservation and VIP Guest Sanctuary">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FIRE SPICE">
  <meta name="application-name" content="FIRE SPICE">
  <meta name="msapplication-TileColor" content="#060608">

  <!-- Icons & Web App Manifest -->
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Luxury Black & Gold Glassmorphic Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=1.0.21">

  <!-- Google Fonts: Non-blocking load so app renders instantaneously offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"></noscript>

  <!-- React 18 & ReactDOM: Production Bundles -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>

  <!-- EmailJS SDK: Send owner login-alert emails from the client -->
  <script src="vendor/emailjs.min.js"></script>

  <!-- Razorpay Checkout SDK: Real-time Live Payment Processing -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <!-- React App Root Container with Instant Haute Gastronomie Cooking Preloader -->
  <div id="root">
    <div id="app-preloader" class="cooking-stage-overlay">
      <div class="cooking-bg-glow"></div>
      
      <!-- Cinematic Sauté Video Viewport Station -->
      <div class="cooking-station">
        <div class="cooking-video-frame">
          <div class="cooking-video-tag">✦ LIVE CHEF'S SEARING TABLE ✦</div>
          <div class="cooking-video-corner tl"></div>
          <div class="cooking-video-corner tr"></div>
          <div class="cooking-video-corner bl"></div>
          <div class="cooking-video-corner br"></div>
          <video
            src="cooking-intro.mp4"
            class="cooking-video-element"
            autoplay
            loop
            muted
            playsinline
            webkit-playsinline="true"
            preload="auto"
          ></video>
        </div>
      </div>

      <!-- Center Medallion & Loading State -->
      <div class="cooking-medallion-card">
        <div class="cooking-chef-crest">
          <img src="icons/icon-192.png" alt="FIRE SPICE Emblem" class="cooking-logo-img">
        </div>
        <div class="cooking-chef-badge">
          <span>✦ HAUTE GASTRONOMIE • CHEF'S SEARING TABLE ✦</span>
        </div>
        <h2 class="cooking-card-title">
          WELCOME TO <span className="gold-gradient-text">FIRE SPICE</span>
        </h2>
        <p class="cooking-card-desc">
          Igniting the master kitchen &amp; searing rare spices...
        </p>
        <div class="preloader-bar" style="margin-top: 10px;">
          <div class="preloader-bar-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fail-Safe Diagnostics Script -->
  <script>
    window.addEventListener('error', function(e) {
      var preloader = document.getElementById('app-preloader');
      if (preloader) {
        preloader.innerHTML = `
          <div class="preloader-crest" style="border-color: #f87171;">
            <span style="color: #f87171;">!</span>
          </div>
          <h2 class="preloader-title" style="font-size: 1.5rem; color: #f87171; -webkit-text-fill-color: initial;">EXPERIENCE NOTICE</h2>
          <p style="color: #a6a39b; max-width: 440px; font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px;">
            ${e.message || 'An unexpected initialization error occurred.'}
          </p>
          <button onclick="window.location.reload()" class="btn-glass btn-glass-primary" style="padding: 10px 24px; cursor: pointer;">
            Reload FIRE SPICE
          </button>
        `;
      }
    });
  </script>

  <!-- Service Worker Registration for PWA Offline Caching & Installation -->
  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('[PWA] Service Worker registered successfully, scope:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
      });
    }
  </script>

  <!-- React 18 Application Bundle -->
  <script src="bundle.js?v=1.0.20"></script>

</body>
</html>
