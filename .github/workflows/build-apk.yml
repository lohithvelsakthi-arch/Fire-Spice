name: Build FIRE SPICE Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "=== SEARCHING FOR PRODUCED APKS ==="
          find android -name "*.apk"
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="v1.0.19"
          fi
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" "build-output/FireSpice-${TAG}.apk"
            cp "$APK_FILE" "build-output/FireSpice-v1.0.19.apk"
            cp "$APK_FILE" "build-output/FireSpice-latest.apk"
          else
            echo "ERROR: No APK found!"
            exit 1
          fi
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSpice-APK-Build
          path: build-output/*.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.19' }}
          name: "FIRE SPICE Android App • Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.19' }}"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            ### 🍷 FIRE SPICE • Haute Gastronomie & Golden Lounge
            **Official Android Application Release (v1.0.19 — Royal Red Velvet Curtain with Golden Bottom Border Opening Animation)**

            #### 🛠️ What's New in v1.0.19:
            - **Royal Red Velvet Curtain with 24K Golden Bottom Border**:
              - Heavy theatrical ruby red velvet drapes with vertical shading pleats that cover the first loading page immediately upon opening the app.
              - Finished with an opulent 24K golden bottom border (`#d4af37`), braided gold bullion piping, and bullion fringe along the lower hem.
              - Center gold crest medallion welcoming the patron with an official Google Sign-In button.
              - When signing in with Google (or clicking "Part Grand Curtains"), the red velvet curtains majestically sweep open to the left and right wings with an opera harp arpeggio flourish, revealing the grand dining room!
              - **No obscuring transition screen**: The black page transition overlay is bypassed on entrance so the red curtain parting is 100% visible front-and-center!
              - Dedicated "🎭 Curtain" replay button added in the top header and mobile sub-navigation bar for instant replay anytime.
            - **Google Pay & Under ₹5 Pricing**:
              - Direct UPI transfers to `lohithvelsakthi-1@oksbi` (Payee: FIRE SPICE - Lohith Vel).
              - All table guarantees, tasting menus, and add-ons strictly within ₹1 to ₹5.

            #### 📲 Installation Instructions:
            1. Download `FireSpice-v1.0.19.apk` onto your Android device.
            2. Tap → Allow unknown apps → Update / Install → Launch FIRE SPICE!
          files: build-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
