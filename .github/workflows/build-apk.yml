name: Build FIRE SPICE Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "=== SEARCHING FOR PRODUCED APKS ==="
          find android -name "*.apk"
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" build-output/FireSpice-v1.0.14.apk
          else
            echo "ERROR: No APK found!"
            exit 1
          fi
          ls -lh build-output/FireSpice-v1.0.14.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSpice-v1.0.14-APK
          path: build-output/FireSpice-v1.0.14.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.14
          name: "FIRE SPICE Android App • Release v1.0.14"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            ### 🍷 FIRE SPICE • Haute Gastronomie & Golden Lounge
            **Official Android Application Release (v1.0.14 — Official Brand Logo & App Icon)**

            #### ✨ What's New in v1.0.14:
            - **Official Gilded Logo Everywhere**: Embedded the bespoke gold cloche & cutlery "FIRE SPICE est 2026" crest logo across all app surfaces:
              - App Launcher Icons (Android adaptive square & circular mipmaps: mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi)
              - Web PWA Icons & Favicons (512x512, 192x192, 180x180, SVG)
              - Luxury Header Brand Crest
              - App Preloader / Splash Screen
              - Multi-Step Cinematic Loading Overlay
              - Member Sanctuary Sign-in Modal
              - Gated Reservation Sanctuary Gate
              - Grand Lounge Hero Section
              - Step 4 Reservation Guarantee Receipt
              - Step 5 Official VIP Dining Pass
              - Luxury Atelier Footer
            - **Database Button Removed**: Clean header without inspect database button as requested.
            - **Cinematic Step Loading Phases**: Multi-phase interactive page simulation active between each booking step.

            #### 📲 Installation Instructions:
            1. Download `FireSpice-v1.0.14.apk` onto your Android device.
            2. Tap → Allow unknown apps → Update / Install → Launch FIRE SPICE!
          files: build-output/FireSpice-v1.0.14.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
