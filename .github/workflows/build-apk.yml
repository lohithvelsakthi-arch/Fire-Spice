name: Build FIRE SPICE Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "=== SEARCHING FOR PRODUCED APKS ==="
          find android -name "*.apk"
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" build-output/FireSpice-v1.0.15.apk
          else
            echo "ERROR: No APK found!"
            exit 1
          fi
          ls -lh build-output/FireSpice-v1.0.15.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSpice-v1.0.15-APK
          path: build-output/FireSpice-v1.0.15.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.15
          name: "FIRE SPICE Android App • Release v1.0.15"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            ### 🍷 FIRE SPICE • Haute Gastronomie & Golden Lounge
            **Official Android Application Release (v1.0.15 — Fixed Android Adaptive Launcher Icon)**

            #### 🛠️ What's Fixed in v1.0.15:
            - **Android Home Screen Launcher Icon Fixed**:
              - Corrected Android 8.0+ / 13+ / 14+ Adaptive Icon specification (`mipmap-anydpi-v26/ic_launcher.xml` and `ic_launcher_round.xml`).
              - Replaced broken XML layer-list with native density-specific PNG foreground bitmaps (`ic_launcher_foreground.png` for mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi) properly padded within the 72dp safe zone.
              - Removed the `<monochrome>` attribute that caused Android Material You / Samsung Color Palette / Pixel Themed Icons to tint the launcher icon into a blank solid purple square.
              - Added `colors.xml` declaring `@color/ic_launcher_background` (`#060608` Obsidian Noir).
              - Updated all legacy square & circular mipmap icons.
            - **Full-Color 24K Gold Cloche Logo**: Now renders with full fidelity on all Android home screens, app drawers, and notification trays.

            #### 📲 Installation Instructions:
            1. Download `FireSpice-v1.0.15.apk` onto your Android device.
            2. Tap → Allow unknown apps → Update / Install → Launch FIRE SPICE!
          files: build-output/FireSpice-v1.0.15.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
