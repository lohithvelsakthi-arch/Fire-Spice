name: Build FIRE SPICE Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "=== SEARCHING FOR PRODUCED APKS ==="
          find android -name "*.apk"
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" build-output/FireSpice-v1.0.1.apk
          else
            echo "ERROR: No APK found!"
            exit 1
          fi
          ls -lh build-output/FireSpice-v1.0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSpice-v1.0.1-APK
          path: build-output/FireSpice-v1.0.1.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "FIRE SPICE Android App • Release v1.0.1"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            ### 🍷 FIRE SPICE • Haute Gastronomie & Golden Lounge
            **Official Android Application Release (v1.0.1)**

            #### 🛠️ What's New in v1.0.1:
            - **Resolved Launch Crash**: Aligned Java package structure to `com.firespice.restaurant.MainActivity` with fail-safe startup.
            - **Custom 24K Gold "FS" Adaptive App Icon**: Sharp high-resolution gold crest centered on obsidian noir canvas for all Android 8+ launchers.
            - **Offline WebView Hardware Acceleration**: Embedded React 18, Glassmorphic styling, and interactive seating map.

            #### 📲 Installation Instructions:
            1. Download `FireSpice-v1.0.1.apk` below directly onto your Android device.
            2. Tap the downloaded file in your browser or Downloads folder.
            3. If prompted, allow *"Install unknown apps"* for your browser.
            4. Tap **Install** and launch **FIRE SPICE** from your app drawer!
          files: build-output/FireSpice-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
