name: Build FIRE SPICE Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "=== SEARCHING FOR PRODUCED APKS ==="
          find android -name "*.apk"
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" build-output/FireSpice-v1.0.17.apk
          else
            echo "ERROR: No APK found!"
            exit 1
          fi
          ls -lh build-output/FireSpice-v1.0.17.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSpice-v1.0.17-APK
          path: build-output/FireSpice-v1.0.17.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.17
          name: "FIRE SPICE Android App • Release v1.0.17"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            ### 🍷 FIRE SPICE • Haute Gastronomie & Golden Lounge
            **Official Android Application Release (v1.0.17 — Mobile UX Polish, Optimized Rolling Ribbon & Luxury Button Sizing)**

            #### 🛠️ What's New in v1.0.17:
            - **Cinematic Rolling Ribbon Optimized for Mobile**:
              - Perfectly positioned at the upper crown of mobile screens (`top: 24%`), gracefully framing the emblem without obscuring the hero title or booking buttons.
              - 60fps GPU hardware acceleration with pre-decoded imagery (`loading="eager"` and `decoding="async"`), eliminating blank grey cards and micro-stutters in Android WebView.
              - Sized proportionally (`280px x 195px` on phones, `245px x 170px` on compact screens) with 24K gold border glow and deep velvet shadows.
            - **Luxury Button Sizing & Mobile Touch Architecture**:
              - Generous, ergonomic touch targets (minimum 44px - 54px height) across all mobile buttons: Hero CTA buttons, Header actions, Mobile Sub-Nav pills, Calendar day buttons, Time slots, Zone filters, Table nodes, and Console footer buttons.
              - Native tactile tap feedback (`active: scale(0.97)` with instant haptic visual brightness).
              - Eliminated 300ms mobile tap delay (`touch-action: manipulation`) and removed web tap grey highlights (`-webkit-tap-highlight-color: transparent`).
            - **Google Pay & Under ₹5 Pricing Maintained**:
              - Direct UPI transfers to `lohithvelsakthi-1@oksbi` (Payee: FIRE SPICE - Lohith Vel).
              - All tasting menus, table guarantees, and add-ons strictly within ₹1 to ₹5.

            #### 📲 Installation Instructions:
            1. Download `FireSpice-v1.0.17.apk` onto your Android device.
            2. Tap → Allow unknown apps → Update / Install → Launch FIRE SPICE!
          files: build-output/FireSpice-v1.0.17.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
