name: Build FIRE SPICE Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "=== SEARCHING FOR PRODUCED APKS ==="
          find android -name "*.apk"
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="v1.0.22"
          fi
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" "build-output/FireSpice-${TAG}.apk"
            cp "$APK_FILE" "build-output/FireSpice-v1.0.22.apk"
            cp "$APK_FILE" "build-output/FireSpice-latest.apk"
          else
            echo "ERROR: No APK found!"
            exit 1
          fi
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSpice-APK-Build
          path: build-output/*.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.22' }}
          name: "FIRE SPICE Android App • Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.22' }}"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            ### 🍷 FIRE SPICE • Haute Gastronomie & Golden Lounge
            **Official Android Application Release (v1.0.22 — Fullscreen Background Cinematic Video & 4s Timeframe)**

            #### 🛠️ What's New in v1.0.22:
            - **Fullscreen Cinematic Video Background**:
              - The searing pan and tossing chili pepper video now spans edge-to-edge across the entire screen behind the Google sign-in card.
              - Luxury radial vignette scrim overlay ensuring 100% legibility and crisp contrast for all buttons and text.
            - **Extended 4-Second Intro Timeframe**:
              - Intro timeframe extended to 4.0 seconds for an immersive culinary spectacle.
              - Smooth, golden flambé veil transition gracefully dissolving the video stage into the dining sanctuary.
            - **Google Pay & Under ₹5 Pricing Maintained**:
              - Direct UPI transfers to `lohithvelsakthi-1@oksbi` (Payee: FIRE SPICE - Lohith Vel).
              - All table reservations, tasting menus, and add-ons strictly within ₹1 to ₹5.

            #### 📲 Installation Instructions:
            1. Download `FireSpice-v1.0.22.apk` onto your Android device.
            2. Tap → Allow unknown apps → Update / Install → Launch FIRE SPICE!
          files: build-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
