name: Build FIRE SPICE Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "=== SEARCHING FOR PRODUCED APKS ==="
          find android -name "*.apk"
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" build-output/FireSpice-v1.0.3.apk
          else
            echo "ERROR: No APK found!"
            exit 1
          fi
          ls -lh build-output/FireSpice-v1.0.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSpice-v1.0.3-APK
          path: build-output/FireSpice-v1.0.3.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "FIRE SPICE Android App • Release v1.0.3"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            ### 🍷 FIRE SPICE • Haute Gastronomie & Golden Lounge
            **Official Android Application Release (v1.0.3)**

            #### 🛠️ What's New in v1.0.3:
            - **Capacitor 8 Engine Integration**: Native bridge architecture loading local web assets via high-performance bridge (`BridgeActivity`).
            - **Zero Blank Screen / CORS Immunity**: Bypasses browser `file:///` restrictions and guarantees immediate React UI hydration.
            - **Seamless Offline Storage & Caching**: SQLite and localStorage operational with embedded styles, fonts, and assets.
            - **Obsidian Noir & 24K Gold Adaptive App Icon**: Luxury crest launcher icon rendered crisply across all modern Android devices.

            #### 📲 Installation Instructions:
            1. Download `FireSpice-v1.0.3.apk` below directly onto your Android device.
            2. Tap the downloaded file in your browser or Downloads folder.
            3. If prompted, allow *"Install unknown apps"* for your browser.
            4. Tap **Install** and launch **FIRE SPICE** from your app drawer!
          files: build-output/FireSpice-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
