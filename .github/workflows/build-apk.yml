name: Build FIRE SPICE Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "=== SEARCHING FOR PRODUCED APKS ==="
          find android -name "*.apk"
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" build-output/FireSpice-v1.0.18.apk
          else
            echo "ERROR: No APK found!"
            exit 1
          fi
          ls -lh build-output/FireSpice-v1.0.18.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSpice-v1.0.18-APK
          path: build-output/FireSpice-v1.0.18.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.18
          name: "FIRE SPICE Android App • Release v1.0.18"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            ### 🍷 FIRE SPICE • Haute Gastronomie & Golden Lounge
            **Official Android Application Release (v1.0.18 — Royal Red Velvet Curtain with Golden Bottom Border Entrance Animation)**

            #### 🛠️ What's New in v1.0.18:
            - **Royal Red Velvet Theater Curtain Opening Animation**:
              - Grand opera-house red velvet curtain with rich vertical satin folds and 3D lighting that blankets the initial loading entrance page.
              - Finished with an opulent 24K golden bottom border (`#d4af37`), braided gold bullion piping, and tasseled fringe along the hem.
              - Features a central gilded royal medallion with Google Sign-In prompt.
              - When the user signs in with Google (or opens the app with saved Google credentials), the curtains majestically part from the center to reveal the golden dining room and table reservation console.
              - Accompanied by an ascending harp arpeggio entrance chime (`playChime('curtain')`).
              - Replay button added to Ambiance and VIP menus for reviewing the animation anytime.
            - **Google Pay & Under ₹5 Pricing Maintained**:
              - Direct UPI transfers to `lohithvelsakthi-1@oksbi` (Payee: FIRE SPICE - Lohith Vel).
              - All table guarantees, tasting menus, and add-ons strictly within ₹1 to ₹5.

            #### 📲 Installation Instructions:
            1. Download `FireSpice-v1.0.18.apk` onto your Android device.
            2. Tap → Allow unknown apps → Update / Install → Launch FIRE SPICE!
          files: build-output/FireSpice-v1.0.18.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
