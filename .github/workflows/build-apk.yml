name: Build FIRE SPICE Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "=== SEARCHING FOR PRODUCED APKS ==="
          find android -name "*.apk"
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" build-output/FireSpice-v1.0.16.apk
          else
            echo "ERROR: No APK found!"
            exit 1
          fi
          ls -lh build-output/FireSpice-v1.0.16.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSpice-v1.0.16-APK
          path: build-output/FireSpice-v1.0.16.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.16
          name: "FIRE SPICE Android App • Release v1.0.16"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            ### 🍷 FIRE SPICE • Haute Gastronomie & Golden Lounge
            **Official Android Application Release (v1.0.16 — Google Pay & UPI Live Payments & Under ₹5 Pricing)**

            #### 🛠️ What's New in v1.0.16:
            - **Google Pay (GPay) & Direct UPI Payments**:
              - Direct payment settlement to owner's SBI Google Pay account (`lohithvelsakthi-1@oksbi`).
              - One-tap Google Pay app launcher on Android (`upi://pay`).
              - Dynamic real-time UPI QR code generation for instant scanning.
              - Instant cryptographic verification and SQLite transaction logging.
            - **All Meal & Table Costs Under ₹5**:
              - All table minimum spend guarantees, tasting menus, and culinary add-ons adjusted strictly within ₹1 to ₹5.
            - **Verified VIP Dining Pass**:
              - Displays official "✓ GUARANTEE DEPOSIT PAID VIA GOOGLE PAY" badge with UPI transaction reference.
            - **Android Home Screen Icon**:
              - Full 24K gold FIRE SPICE cloche logo on obsidian noir (`#060608`).

            #### 📲 Installation Instructions:
            1. Download `FireSpice-v1.0.16.apk` onto your Android device.
            2. Tap → Allow unknown apps → Update / Install → Launch FIRE SPICE!
          files: build-output/FireSpice-v1.0.16.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
