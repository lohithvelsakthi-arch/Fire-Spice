name: Build FIRE SPICE Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "=== SEARCHING FOR PRODUCED APKS ==="
          find android -name "*.apk"
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" build-output/FireSpice-v1.0.4.apk
          else
            echo "ERROR: No APK found!"
            exit 1
          fi
          ls -lh build-output/FireSpice-v1.0.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSpice-v1.0.4-APK
          path: build-output/FireSpice-v1.0.4.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "FIRE SPICE Android App • Release v1.0.4"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            ### 🍷 FIRE SPICE • Haute Gastronomie & Golden Lounge
            **Official Android Application Release (v1.0.4 - Mobile Responsive Edition)**

            #### 📱 What's New in v1.0.4:
            - **Mobile Screen Optimization**: Fluid responsive layout engineered specifically for mobile devices and smartphones (360px - 430px screens).
            - **Edge-to-Edge Safe Area Insets**: Notch, camera cutouts, and bottom navigation pill support using CSS environment variables (`--sat`, `--sab`, `--sal`, `--sar`).
            - **Collapsible Luxury Floating Controls**: Bottom ambiance controller neatly collapses into a floating gold emblem on mobile, preventing overlap with reservation booking action buttons.
            - **Touch-Friendly Stacking**: Stepper tabs, party size selector, date/time pickers, and interactive floor plan grid adapt dynamically into full-width mobile cards.
            - **Header Compact Navigation**: Action buttons gracefully collapse text labels to clean gold icons, accompanied by a mobile quick-access sub-navigation bar.
            - **Zero Horizontal Scroll**: Elimination of wide desktop grid constraints to ensure comfortable single-handed mobile touch interaction.

            #### 📲 Installation Instructions:
            1. Download `FireSpice-v1.0.4.apk` below directly onto your Android device.
            2. Tap the downloaded file in your browser or Downloads folder.
            3. If prompted, allow *"Install unknown apps"* for your browser.
            4. Tap **Install** and launch **FIRE SPICE** from your app drawer!
          files: build-output/FireSpice-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
