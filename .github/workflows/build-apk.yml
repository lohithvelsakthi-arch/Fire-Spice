name: Build FIRE SPICE Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "=== SEARCHING FOR PRODUCED APKS ==="
          find android -name "*.apk"
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="v1.0.20"
          fi
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" "build-output/FireSpice-${TAG}.apk"
            cp "$APK_FILE" "build-output/FireSpice-v1.0.20.apk"
            cp "$APK_FILE" "build-output/FireSpice-latest.apk"
          else
            echo "ERROR: No APK found!"
            exit 1
          fi
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSpice-APK-Build
          path: build-output/*.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.20' }}
          name: "FIRE SPICE Android App • Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.20' }}"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            ### 🍷 FIRE SPICE • Haute Gastronomie & Golden Lounge
            **Official Android Application Release (v1.0.20 — Master Chef's Sauté & Flaming Flambé Culinary Animation)**

            #### 🛠️ What's New in v1.0.20:
            - **Haute Gastronomie Chef's Cooking Animation**:
              - Replaced curtain design with an exquisite luxury cooking animation on the first entrance page.
              - Polished titanium & brass sauté skillet on active stove burners with flickering blue & golden gas flames.
              - Rhythmic culinary tossing animation with vibrant spices, fiery crimson chili, saffron embers, fresh rosemary, and garlic lofting into the air.
              - Aromatic rising steam wisps and sizzling ember sparks.
              - Center culinary medallion with Michelin distinction and Google Sign-In prompt.
              - When signing in with Google (or clicking "Enter Dining Sanctuary"), an expansive golden flambé burst flares up with a sizzling culinary arpeggio chime, seamlessly unveiling the dining sanctuary!
              - Dedicated "🍳 Cooking" replay button in header and mobile navigation to replay the animation anytime.
            - **Google Pay & Under ₹5 Pricing Maintained**:
              - Direct UPI transfers to `lohithvelsakthi-1@oksbi` (Payee: FIRE SPICE - Lohith Vel).
              - All table reservations, tasting menus, and add-ons strictly within ₹1 to ₹5.

            #### 📲 Installation Instructions:
            1. Download `FireSpice-v1.0.20.apk` onto your Android device.
            2. Tap → Allow unknown apps → Update / Install → Launch FIRE SPICE!
          files: build-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
